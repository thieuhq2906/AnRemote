; AnRemote - bo phat hong ngoai cho dieu hoa Toshiba
; Build:  pio run -e d1_mini        (hoac nodemcuv2 / esp32dev)
; Nap:    pio run -e d1_mini -t upload

[platformio]
default_envs = d1_mini

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D IR_LED_PIN=4

[env:d1_mini]
platform = espressif8266
board = d1_mini

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

[env:esp32dev]
; Giu Arduino core 2.x: IRremoteESP8266 2.8.6 chua build duoc voi core 3.x
platform = espressif32@^6.9.0
board = esp32dev
