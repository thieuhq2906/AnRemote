name: AnRemote
options:
  bundleIdPrefix: com.anremote
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  AnRemote:
    type: application
    platform: iOS
    sources:
      - AnRemote
    scheme: {}
    info:
      path: AnRemote/Info.plist
      properties:
        CFBundleDisplayName: AnRemote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: AnRemote cần truy cập mạng nội bộ để gửi lệnh tới bộ phát hồng ngoại của điều hòa.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anremote.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
